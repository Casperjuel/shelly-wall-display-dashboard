[package]
name = "hjemctl"
version = "0.1.0"
edition = "2021"
description = "Control Shelly Wall Displays for the hjem dashboards"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
futures = "0.3"
owo-colors = "4"
mdns-sd = "0.11"
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "0.8"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
