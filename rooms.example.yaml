# ─────────────────────────────────────────────────────────────────────────────
#  EXAMPLE MANIFEST
#
#  Copy this to `rooms.yaml` and make it yours — `npm run gen` does that for you
#  on first run. Your own rooms.yaml is gitignored, so your house stays out of
#  version control.
#
#  Room names here are generic. Replace slugs, names, accents and entity ids
#  with your own; everything else in the repo derives from this one file.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  locale: da-DK
  timezone: Europe/Copenhagen
  # Long-lived access token lives in .env / on-device, never in this file.
  ha_url: "http://homeassistant.local:8123"

# ── Hardware ────────────────────────────────────────────────────────────────
# wd  = Shelly Wall Display (Shelly_WallD_BLU_HT_Black)
#       MTK6580 · quad Cortex-A7 ARMv7 · Mali-400 MP2 · 1 GB RAM · 4" square
#       >>> the performance floor. Design for this device first. <<<
# xl  = Shelly Wall Display XL
#       Rockchip RK3566 · quad Cortex-A55 1.8 GHz · Mali-G52 · 2 GB · 10.1"
models:
  wd:
    label: "Shelly Wall Display"
    soc: MTK6580
    # VERIFY ON DEVICE: open /measure.html on the panel and paste results here.
    canvas: { w: 480, h: 480, dpr: 1 }
    shell: tabs          # 4 bottom tabs, one room
    budget:
      max_dom_nodes: 900
      max_bundle_gz_kb: 32   # enforced by tools/build.mjs (raised after measuring the device)
      no_blur: true      # Mali-400: backdrop-filter is a frame-killer
      no_photos: true    # 1 GB RAM: no full-screen JPEGs
  xl:
    label: "Shelly Wall Display XL"
    soc: RK3566
    canvas: { w: 1280, h: 752, dpr: 1 }
    shell: overview      # whole-house grid, all rooms at once
    budget:
      max_dom_nodes: 2500
      max_bundle_gz_kb: 32
      no_blur: true
      no_photos: true

# ── Integrations in play ────────────────────────────────────────────────────
integrations:
  hue:    { domain: light,        note: "Philips Hue bulb in every room" }
  shelly: { domain: light,        note: "Shelly Pro relay — lamp outlet (lampeudtag)" }
  wavin:  { domain: climate,      note: "Wavin Sentio/AHC9000 floor heating, one zone per room" }
  sonos:  { domain: media_player, note: "Sonos speaker in every room" }

# ── Rooms ───────────────────────────────────────────────────────────────────
# `?` suffix on an entity = unverified guess, will be resolved by `npm run discover`.
rooms:
  - slug: kokken
    accent: "#F59E2C"   # vivid messing — køkkenets kobber
    name: "Køkken"
    icon: kitchen
    display: xl
    order: 1
    entities:
      lights:
        - { entity: "light.kokken_hue?",        name: "Loft",     kind: hue }
        - { entity: "light.kokken_lampeudtag?", name: "Bordlampe", kind: shelly }
      climate: "climate.kokken?"
      media:   "media_player.kokken?"
      temperature: "sensor.kokken_temperatur?"
      humidity:    "sensor.kokken_luftfugtighed?"

  - slug: stue
