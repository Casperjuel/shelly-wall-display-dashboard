  - slug: sovevaerelse
    accent: "#A87BFF"   # violet — ro
    name: "Soveværelse"
    icon: bed
    display: wd
    order: 5
    entities:
      lights:
        - { entity: "light.sovevaerelse_hue?",        name: "Hue",        kind: hue }
        - { entity: "light.sovevaerelse_lampeudtag?", name: "Lampeudtag", kind: shelly }
      climate: "climate.sovevaerelse?"
      media:   "media_player.sovevaerelse?"
      temperature: "sensor.sovevaerelse_temperatur?"
      humidity:    "sensor.sovevaerelse_luftfugtighed?"

  - slug: barn_1
    # ── Vågeur (sleep clock) ────────────────────────────────────────────────
    # A moon-to-sun timer a child can read without reading. The panel takes
    # over the screen at bedtime, dims right down, and only shows the sun when
    # it is genuinely OK to get up.
    wake:
      enabled: true
      sleep_at: "19:30"     # night starts — screen dims, moon appears
      wake_at:  "07:00"     # sun is fully up; allowed out of bed
      dawn_minutes: 90      # sunrise starts 05:30 and brightens until 07:00
      morning_minutes: 90   # how long the sun stays before the normal dashboard
      night_brightness: 4   # % — bright enough to see, dim enough to sleep by
      dawn_brightness: 35   # % at the end of the sunrise, before the sun is up
      # Optional HA overrides. If these entities exist they win, so a parent can
      # move tomorrow's wake time from their phone or set a weekend schedule —
      # but the panel still works on its own when HA is down.
      wake_entity: "input_datetime.<slug>_vaagetid"
      enabled_entity: "input_boolean.<slug>_vaageur"
      day_brightness: 70
    accent: "#3FC77F"   # skovgrøn
    name: "Barn 1"
    short: "Barn 1"
    icon: child
    display: wd
    order: 6
    entities:
