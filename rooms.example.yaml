# ── Tema ────────────────────────────────────────────────────────────────────
# The panels follow the sun rather than a fixed clock: `sun.sun` already knows
# sunrise/sunset for your latitude, which in Denmark swings by ~7 hours across
# the year. A fixed 07–20 rule would have the bedroom panel glaring white at
# 07:00 in December and dark at 21:00 in June.
theme:
  mode: sun            # sun | time | dark | light
  sun_entity: "sun.sun"
  # used only when mode: time, or when sun.sun is unavailable
  light_from: "07:00"
  light_to: "21:00"
  # Ease into the change so a panel on the wall never *snaps* while you look at
  # it. Long, because this happens twice a day and should be imperceptible.
  transition_ms: 1200

# ── Scenes ──────────────────────────────────────────────────────────────────
# Shown on every panel's Scener tab. `scope: room` renders a per-room variant
# (scene.<slug>_<id>); `scope: house` is a single global scene.
scenes:
  # `mood` is what the scene LOOKS like, and it drives the tile's gradient:
  #   k     colour temperature in kelvin (2000 = candle, 6500 = overcast daylight)
  #   hex   explicit primary colour, overrides k
  #   hue2  a SECOND colour blended in from the opposite corner. This is what
  #         stops a tile being one flat tone — real light in a room is never a
  #         single hue, and two pools reading against each other is most of
  #         what makes these tiles look alive.
  #   level 0–1 overall brightness — a dark scene renders as a dark tile
  # Set these to match what the scene actually does in HA and the panel becomes
  # readable at a glance: you pick a scene by its swatch, not by its label.
  - { id: aften,       name: "Aften",       icon: sunset,  scope: room,
      mood: { k: 2300, hue2: "#FF3D77", level: 0.62 } }      # solnedgang: rav + rosa
  - { id: hygge,       name: "Hygge",       icon: flame,   scope: room,
      mood: { k: 1900, hue2: "#E0342B", level: 0.38 } }      # levende lys + glød
  - { id: laesning,    name: "Læsning",     icon: book,    scope: room,
      mood: { k: 4300, hue2: "#4C8DFF", level: 0.88 } }      # neutralt + kølig blå
  - { id: rengoring,   name: "Rengøring",   icon: sparkle, scope: room,
      mood: { k: 6000, hue2: "#37D9E8", level: 1.00 } }      # dagslys + cyan
  - { id: godnat,      name: "Godnat",      icon: moon,    scope: house,
      mood: { hex: "#3B2A8C", hue2: "#C24A6E", level: 0.22 } } # nat: indigo + dyb rosa
  - { id: alt_slukket, name: "Alt slukket", icon: power,   scope: house,
      mood: { k: 2700, level: 0.05 } }                        # næsten intet

# Colours for the now-playing "aura" on the Musik tab. Three soft blobs.
sonos_aura: ["#2BD4A0", "#3C8FFF", "#C766FF"]

# ── Sonos favourites shown as one-tap buttons on the Musik tab ──────────────
sonos_favourites:
  # Real Sonos favourite names are long — keep one here so the layout is
  # exercised honestly during development.
  - { name: "P3",        source: "DR P3" }
  - { name: "P4",        source: "DR P4 København" }
  - { name: "Morgen",    source: "Godmorgen børnehave" }
  - { name: "Everyday",  source: "Everyday (feat. Rod Stewart, Miguel & Mark Ronson)" }

# ── Heating presets (Wavin) ────────────────────────────────────────────────
heating:
  min: 15
  max: 26
  step: 0.5
  presets:
    - { name: "Nat",   temp: 18 }
    - { name: "Hjemme",temp: 21 }
    - { name: "Varmt", temp: 23 }
