# Which panel is in which room.
#
# Copy to panels.yaml (gitignored) and fill in your own addresses. Give each
# panel a DHCP reservation on your router first — a wall display that changes
# address every lease is a panel you have to hunt for.
#
# The slugs must match the room slugs in rooms.yaml: panelctl builds each
# panel's dashboard URL from its slug.
#
#   ./tools/panelctl.sh status
#   ./tools/panelctl.sh provision all

