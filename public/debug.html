<!doctype html><html lang="da"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hjem · debug suite</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0b0d10;--s1:#14181e;--s2:#1b2027;--s3:#242b34;--line:#2a323d;
      --fg:#eef1f5;--dim:#9aa4b2;--faint:#626d7d;
      --lys:#f5b73d;--varme:#ff7a45;--musik:#4fd08a;--scene:#7b8cff;--bad:#ff5c5c;--ok:#4fd08a}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:grid;grid-template-columns:1fr 400px;overflow:hidden}

/* ── left: panel grid ── */
#stage{overflow:auto;padding:16px}
#stage h2{font:600 12px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px}
#grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.dev{background:var(--s1);border:1px solid var(--line);border-radius:12px;
  padding:8px;display:flex;flex-direction:column;gap:6px}
.dev-hd{display:flex;align-items:center;gap:6px;font:600 11px/1 system-ui}
.dev-hd .slug{color:var(--dim)}
.dev-hd .badge{margin-left:auto;font-size:9px;padding:2px 5px;border-radius:4px;
  background:var(--s3);color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.dot.ready{background:var(--ok)}.dot.lost{background:var(--bad)}
.frame{position:relative;overflow:hidden;border-radius:8px;background:#000;flex:0 0 auto}
.frame iframe{border:0;display:block;transform-origin:top left}
.dev.sel{border-color:var(--lys)}

/* ── right: inspector ── */
#side{border-left:1px solid var(--line);display:grid;
  grid-template-rows:auto auto auto 1fr;min-height:0;background:var(--s1)}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{font:700 10px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:600 11px/1 system-ui;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--s2);color:var(--fg);cursor:pointer}
button:hover{background:var(--s3)}
button.hot{background:var(--lys);color:#201800;border-color:var(--lys)}
button.run{background:var(--scene);color:#fff;border-color:var(--scene)}
select,input[type=text]{font:11px ui-monospace,monospace;padding:6px;border-radius:6px;
  border:1px solid var(--line);background:var(--s2);color:var(--fg)}
input[type=range]{flex:1;accent-color:var(--lys)}
label{font:600 10px/1 system-ui;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--s2);border-radius:7px;padding:7px 8px}
.stat b{display:block;font:700 17px/1.1 system-ui;font-variant-numeric:tabular-nums}
.stat span{font:600 9px/1 system-ui;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.stat.paint b{color:var(--ok)}.stat.settle b{color:var(--varme)}

#log{overflow-y:auto;padding:6px 10px;min-height:0;font-size:11px}
.ev{display:grid;grid-template-columns:52px 62px 1fr;gap:7px;padding:2px 0;
  border-bottom:1px solid rgba(42,50,61,.4)}
.ev .t{color:var(--faint);font-variant-numeric:tabular-nums}
.ev .r{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.tap .m{color:var(--lys)}
.ev.action .m{color:var(--scene)}
.ev.predict .m{color:var(--musik)}
.ev.settle .m{color:var(--varme)}
.ev.conn .m{color:var(--dim)}
.ev.fail .m{color:var(--bad)}
.ev.test .m{color:var(--ok);font-weight:700}
#log:empty::after{content:'ingen hændelser endnu — tryk på et panel';color:var(--faint)}
.muted{color:var(--faint);font:10px/1.5 system-ui}

/* Phone / tablet: stack the inspector under the devices instead of a 400px
   side rail, and let the panel grid centre itself. */
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto}
  #stage{overflow:visible;padding:12px}
  #grid{justify-content:center}
  #side{border-left:0;border-top:1px solid var(--line);
        grid-template-rows:auto auto auto auto;position:sticky;bottom:0}
  #log{max-height:38vh}
}
</style></head><body>

<div id="stage">
  <h2>Enheder <span id="scaleLbl" class="muted"></span></h2>
  <div id="grid"></div>
</div>

<div id="side">
  <div class="sec">
    <h3>Styring</h3>
    <div class="row" style="margin-bottom:8px">
      <button id="reload">Genindlæs alle</button>
      <button id="clear">Ryd log</button>
      <button class="run" id="smoke">Kør smoke-test</button>
      <button id="sun">☀︎ / ☾ skift sol</button>
    </div>
    <div class="row" style="margin-bottom:6px">
      <label style="width:56px">Zoom</label>
      <input type="range" id="zoom" min="40" max="150" value="100">
      <span id="zoomVal" class="muted" style="width:34px;text-align:right">100%</span>
    </div>
    <div class="row">
      <label style="width:56px">HA lag</label>
      <input type="range" id="lag" min="0" max="1200" step="50" value="300">
      <span id="lagVal" class="muted" style="width:52px;text-align:right">300 ms</span>
    </div>
    <div class="muted" style="margin-top:6px">
      Skru lag op for at se den optimistiske opdatering arbejde: <b>maling</b> bør
      blive ~16 ms mens <b>settle</b> følger lag.
    </div>
  </div>

  <div class="sec">
    <h3>Tryk en kontrol</h3>
    <div class="row">
      <select id="keySel" style="flex:1;min-width:0"></select>
      <button class="hot" id="press">Tryk</button>
    </div>
    <div class="row" style="margin-top:6px">
      <select id="scopeSel">
        <option value="one">valgt panel</option>
        <option value="all">alle paneler</option>
      </select>
      <span class="muted" id="keyCount"></span>
    </div>
  </div>

  <div class="sec">
    <h3>Latens</h3>
    <div class="stats">
      <div class="stat paint"><b id="sPaint">–</b><span>maling</span></div>
      <div class="stat settle"><b id="sSettle">–</b><span>settle p50</span></div>
      <div class="stat"><b id="sP95">–</b><span>settle p95</span></div>
      <div class="stat"><b id="sFail">0</b><span>tabt</span></div>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
const MODELS = { wd:{w:480,h:480,label:'Wall Display · 4"'}, xl:{w:1280,h:752,label:'XL · 10.1"'} };
const grid=document.getElementById('grid'), log=document.getElementById('log');
const origin=location.origin;
let CFG=null, selected=null, scale=1;
const frames=new Map();          // slug -> {iframe, dot, dev}
const settles=[]; let fails=0, lastTap=0, paintSamples=[];

/* room list comes from rooms.json, emitted by `npm run gen` */
fetch('rooms.json').then(r=>r.json()).then(cfg=>{CFG=cfg;build();})
  .catch(()=>{ grid.innerHTML='<p class="muted">rooms.json mangler — kør <b>npm run gen</b></p>'; });

function build(){
  CFG.rooms.forEach(r=>{
    const m=MODELS[r.display];
    const dev=document.createElement('div'); dev.className='dev';
    dev.innerHTML=`<div class="dev-hd"><span class="dot"></span>
      <span>${r.name}</span><span class="slug">${r.slug}</span>
      <span class="badge">${m.label}</span></div>`;
    const frame=document.createElement('div'); frame.className='frame';
    const f=document.createElement('iframe');
    f.src=`index.html?room=${r.slug}&token=mock-token&ha=${encodeURIComponent(origin)}&debug=1`;
    f.width=m.w; f.height=m.h;
    frame.append(f); dev.append(frame);
    dev.onclick=()=>select(r.slug);
    grid.append(dev);
    frames.set(r.slug,{iframe:f,dot:dev.querySelector('.dot'),dev,model:r.display});
  });
  applyZoom();
  select(CFG.rooms.find(r=>r.display==='wd')?.slug ?? CFG.rooms[0].slug);
  setTimeout(refreshKeys,1200);
}

function select(slug){
  selected=slug;
  frames.forEach((v,k)=>v.dev.classList.toggle('sel',k===slug));
  refreshKeys();
}

function applyZoom(){
  frames.forEach(v=>{
    const m=MODELS[v.model];
    const s = v.model==='xl' ? scale*0.55 : scale;
    v.iframe.style.transform=`scale(${s})`;
    v.iframe.parentElement.style.width=(m.w*s)+'px';
    v.iframe.parentElement.style.height=(m.h*s)+'px';
  });
  document.getElementById('scaleLbl').textContent=
    `— 4" paneler i 1:1 ved 100 % · XL nedskaleret 55 %`;
}

/* ── event ingest ── */
addEventListener('message',e=>{
  const d=e.data; if(!d||!d.__hjem) return;
  if(d.keys){ gotKeys(d.room,d.keys); return; }
  const ev=d.ev; if(!ev) return;
  const f=frames.get(d.room);

  if(ev.type==='conn'&&f){ f.dot.className='dot '+(ev.state==='ready'?'ready':ev.state==='lost'?'lost':''); }
  if(ev.type==='tap') lastTap=performance.now();
  if(ev.type==='predict'&&lastTap){ paintSamples.push(performance.now()-lastTap); lastTap=0; }
  if(ev.type==='settle'){ ev.confirmed?settles.push(ev.ms):fails++; stats(); }

  add(d.room,ev);
});

function add(room,ev){
  const d=document.createElement('div');
  let msg='', cls=ev.type;
  switch(ev.type){
    case 'tap':     msg='⇢ '+ev.key; break;
    case 'action':  msg=ev.service+'  '+(Array.isArray(ev.entity)?`[${ev.entity.length}]`:ev.entity)
                        +(ev.data?'  '+JSON.stringify(ev.data):''); break;
    case 'predict': msg='≈ '+ev.entity+(ev.state?' → '+ev.state:'')
                        +(ev.attributes?' '+JSON.stringify(ev.attributes):''); break;
    case 'settle':  msg=(ev.confirmed?'✓ ':'✗ TABT ')+ev.entity+'  '+ev.ms+' ms';
                    if(!ev.confirmed) cls='fail'; break;
    case 'conn':    msg='⇄ '+ev.state+(ev.detail?' ('+ev.detail+')':''); break;
    case 'ready':   msg='● klar · '+ev.entities+' entiteter'; break;
    case 'test':    msg=ev.msg; break;
  }
  const t=new Date(ev.t??Date.now());
  d.className='ev '+cls;
  d.innerHTML=`<span class="t">${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}.${String(t.getMilliseconds()).padStart(3,'0')}</span>`+
              `<span class="r">${room||''}</span><span class="m"></span>`;
  d.querySelector('.m').textContent=msg;
  log.append(d);
  while(log.children.length>500) log.firstChild.remove();
  log.scrollTop=log.scrollHeight;
}

function stats(){
  const s=[...settles].sort((a,b)=>a-b);
  const p=q=>s.length?Math.round(s[Math.min(s.length-1,Math.floor(s.length*q))]):null;
  document.getElementById('sSettle').textContent=p(.5)!=null?p(.5)+'ms':'–';
  document.getElementById('sP95').textContent=p(.95)!=null?p(.95)+'ms':'–';
  document.getElementById('sFail').textContent=fails;
  if(paintSamples.length){
    const avg=paintSamples.reduce((a,b)=>a+b,0)/paintSamples.length;
    document.getElementById('sPaint').textContent=avg.toFixed(1)+'ms';
  }
}

/* ── key registry ── */
let KEYS=[];
function refreshKeys(){
  const f=frames.get(selected); if(!f) return;
  f.iframe.contentWindow.postMessage({__hjemCmd:1,cmd:'keys'},'*');
}
function gotKeys(room,keys){
  if(room!==selected) return;
  KEYS=keys;
  const sel=document.getElementById('keySel');
  sel.innerHTML=keys.map(k=>`<option>${k}</option>`).join('');
  document.getElementById('keyCount').textContent=keys.length+' kontroller';
}
function press(key,scope){
  const targets = scope==='all' ? [...frames.keys()] : [selected];
  for(const slug of targets){
    // keys are room-prefixed, so re-target per panel
    const local = key.replace(/^[a-z_]+\./, m => slug+'.');
    frames.get(slug).iframe.contentWindow.postMessage({__hjemCmd:1,cmd:'press',key:local},'*');
  }
}
document.getElementById('press').onclick=()=>
  press(document.getElementById('keySel').value,document.getElementById('scopeSel').value);

/* ── smoke test: press every control on the selected panel ── */
document.getElementById('smoke').onclick=async()=>{
  if(!KEYS.length){ add('','{type:"test",msg:"ingen kontroller"}'); return; }
  add(selected,{type:'test',msg:`▶ smoke-test · ${KEYS.length} kontroller`,t:Date.now()});
  let acted=0;
  const off=(e)=>{ if(e.data?.__hjem&&e.data.ev?.type==='action') acted++; };
  addEventListener('message',off);
  for(const k of KEYS){
    press(k,'one');
    await new Promise(r=>setTimeout(r,140));
  }
  await new Promise(r=>setTimeout(r,900));
  removeEventListener('message',off);
  add(selected,{type:'test',
    msg:`■ færdig · ${KEYS.length} tryk → ${acted} service-kald · ${fails} tabt`,t:Date.now()});
};

document.getElementById('sun').onclick=async()=>{
  const r=await fetch('/__sun').then(r=>r.json()).catch(()=>null);
  if(r) add('',{type:'test',msg:'sun.sun → '+r.sun,t:Date.now()});
};
/* One live-reload connection for the whole harness, relayed to each panel.
   Nine separate SSE connections would blow Chrome's per-host limit. */
try {
  var devES = new EventSource('/__reload');
  devES.onmessage = function (e) {
    var msg = String(e.data || 'reload');
    frames.forEach(function (v) {
      try { v.iframe.contentWindow.postMessage({ __hjemDev: true, msg: msg }, '*'); } catch (err) {}
    });
  };
} catch (e) { /* no dev server */ }

document.getElementById('reload').onclick=()=>frames.forEach(v=>v.iframe.contentWindow.location.reload());
document.getElementById('clear').onclick=()=>{log.innerHTML='';settles.length=0;fails=0;paintSamples=[];stats();};

const zoom=document.getElementById('zoom');
zoom.oninput=()=>{scale=+zoom.value/100;document.getElementById('zoomVal').textContent=zoom.value+'%';applyZoom();};

const lag=document.getElementById('lag');
lag.oninput=()=>{
  document.getElementById('lagVal').textContent=lag.value+' ms';
  fetch('/__lag?ms='+lag.value).catch(()=>{});
};

addEventListener('keydown',e=>{
  if(e.key==='r'&&e.metaKey) return;
  if(e.key==='c') document.getElementById('clear').click();
  if(e.key==='t') document.getElementById('smoke').click();
});
</script></body></html>
