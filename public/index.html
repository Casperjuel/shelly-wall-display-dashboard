<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<title>hjem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5' fill='none' stroke='%23f5b73d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#0b0d10}#app{height:100%}</style>
</head>
<body>
<div id="app"></div>
<script src="hjem.js"></script>
<script>
/* Live reload, dev only. Connects to the dev server's SSE endpoint; if that
   endpoint doesn't exist (i.e. served from Home Assistant in production) the
   EventSource simply never opens and this costs nothing.

   NOT opened when embedded in an iframe: the debug suite renders nine panels at
   once, and nine persistent SSE connections exceed Chrome's six-per-host limit
   for HTTP/1.1 — which starves the last panels of the connections they need to
   load at all. Inside the harness, the parent holds one connection and relays
   over postMessage instead. */
(function () {
  var embedded = false;
  try { embedded = window.parent !== window; } catch (e) { embedded = true; }
  if (embedded) {
    addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.__hjemDev !== true) return;
      if (String(d.msg || '').indexOf('demo:') === 0) {
        var w = window.hjem && window.hjem.wake;
        if (w && w.demo) { w.demo(parseInt(String(d.msg).slice(5), 10) || 30); return; }
      }
      location.reload();
    });
    return;
  }
  try {
    var es = new EventSource('/__reload');
    es.onmessage = function (e) {
      var d = String(e.data || '');
      if (d.indexOf('demo:') === 0) {
        // play the sleep clock's full cycle without reloading
        var w = window.hjem && window.hjem.wake;
        if (w && w.demo) { w.demo(parseInt(d.slice(5), 10) || 30); return; }
      }
      location.reload();
    };
  } catch (e) { /* no dev server */ }
})();
</script>
</body>
</html>
